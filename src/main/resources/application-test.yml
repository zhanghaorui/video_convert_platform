server:
  port: 9092

spring:
  # 生产环境数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.18.14.224:3306/video_platform?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: yfsw_test_user
    password: Test_yfsw_1234
    hikari:
      maximum-pool-size: 50         # 生产环境大连接池
      minimum-idle: 10

  # 测试环境RabbitMQ配置
  rabbitmq:
    host: 172.18.14.228
    port: 5672
    username: admin
    password: admin
    virtual-host: /video
    connection-timeout: 30000

# 测试环境MQ队列配置
mq:
  queues:
    video-task: video.task.queue.test

# 测试环境NFS配置
nfs:
  root-path: /data/nfs-storage/test
  base-url: https://video.iees.co
  url-storage-strategy: ABSOLUTE  # 测试环境使用绝对路径，直接存储完整URL

# 测试环境日志配置
logging:
  level:
    com.fab.video_convert_platform: INFO
    org.springframework: WARN
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/video-platform/test.log

# 测试环境特殊配置
video:
  processing:
    temp-dir: /tmp/video-test       # 测试环境临时目录
    ffmpeg:
      timeout: 180000               # 测试环境调整为3分钟
      use-videotoolbox: true         # 测试环境启用VideoToolbox硬件加速

business:
  callback:
    retry-times: 2                  # 测试环境减少重试次数
