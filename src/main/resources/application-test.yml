server:
  port: 9092

spring:
  # 测试环境数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: '${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:video_platform}?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8}'
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:50}         # 测试环境大连接池
      minimum-idle: ${DB_MIN_IDLE:10}

  # 测试环境RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/video}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:30000}

  zipkin:
    enabled: false

# 测试环境MQ队列配置
mq:
  enabled: ${MQ_ENABLED:false} # 测试环境默认禁用MQ消费者，避免上下文测试依赖RabbitMQ
  queues:
    video-task: ${MQ_VIDEO_TASK_QUEUE:video.task.queue.test}

# 测试环境NFS配置
nfs:
  root-path: ${NFS_ROOT_PATH:/tmp/video-nfs/test}
  base-url: '${NFS_BASE_URL:http://localhost:9092/files}'
  url-storage-strategy: ABSOLUTE  # 测试环境使用绝对路径，直接存储完整URL

# 测试环境日志配置
logging:
  level:
    com.fab.video_convert_platform: INFO
    org.springframework: WARN
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:/tmp/video-platform/test.log}

# 测试环境特殊配置
video:
  processing:
    temp-dir: ${VIDEO_TEMP_DIR:/tmp/video-test}       # 测试环境临时目录
    ffmpeg:
      timeout: 300000               # 基础超时时间(毫秒) - 5分钟
      transcode-timeout-per-minute: 40000  # 转码每分钟视频额外40秒时间
      slice-timeout-per-minute: 6000       # 切片每分钟视频额外6秒时间
      validate-timeout: 90000             # 验证操作超时
      validate-quick-timeout: 60000       # 快速验证超时
      use-videotoolbox: false        # 测试环境也使用软件编码

business:
  callback:
    retry-times: 2                  # 测试环境减少重试次数
