server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: '${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:video_dev}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}'
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:3}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:30000}

mq:
  enabled: ${MQ_ENABLED:false}  # 开发环境默认禁用MQ，避免启动依赖
  queues:
    video-task: ${MQ_VIDEO_TASK_QUEUE:video.task.queue.dev}

nfs:
  root-path: ${NFS_ROOT_PATH:/tmp/video-nfs/dev}
  base-url: '${NFS_BASE_URL:http://localhost:8080/files}'
  url-storage-strategy: RELATIVE  # 开发环境使用相对路径，便于域名切换

logging:
  level:
    com.fab.video_convert_platform: DEBUG
    org.springframework.web: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
