spring:
  application:
    name: video-convert-platform
  profiles:
    active: prod

  # 通用Web配置
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 数据库连接池通用配置
  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      maximum-pool-size: 20          # 默认连接池大小
      minimum-idle: 5                # 默认最小空闲连接

  # RabbitMQ通用配置
  rabbitmq:
    connection-timeout: 30000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3

  sleuth:
    sampler:
      probability: 0.1

  zipkin:
    base-url: http://172.18.14.158:9411

# MyBatis-Plus通用配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 生产环境建议关闭SQL日志，使用Logback统一管理
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 业务队列配置
mq:
  queues:
    video-task: video.task.queue      # 默认队列名

# 日志切面配置
logging:
  aspect:
    enabled: true                    # 是否启用日志切面
    max-arg-length: 500             # 参数日志最大长度
    max-result-length: 500          # 返回值日志最大长度
    slow-method-threshold: 3000     # 慢方法阈值(毫秒)，超过此时间会发出警告

# 视频处理通用配置
video:
  processing:
    temp-dir: /tmp/video-processing  # 临时文件目录
    chunk-size: 10MB                 # 分片大小
    max-chunks: 1000                 # 最大分片数
    ffmpeg:
      timeout: 300000                # FFmpeg超时时间(毫秒)
      threads: 2                     # FFmpeg并发线程数
      quality:
        low: 480p                    # 低画质
        standard: 720p               # 标准画质
      segment-duration: 10           # HLS切片时长(秒)

# 业务配置
business:
  callback:
    retry-times: 3                   # 回调重试次数
    timeout: 30000                   # 回调超时时间(毫秒)
  archive:
    enable-md5-check: true           # 是否启用MD5校验
    cleanup-temp-files: true         # 是否自动清理临时文件
    batch-size: 50                   # 批处理大小
    parallel-workers: 4              # 并发处理线程数

# 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    diskspace:
      threshold: 1GB
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5, 0.75, 0.95, 0.99
      sla:
        "[http.server.requests]": 10ms, 50ms, 100ms, 200ms, 500ms
