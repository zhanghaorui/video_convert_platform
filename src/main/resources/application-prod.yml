server:
  port: 9091
  # 生产环境性能优化
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    max-connections: 8192

spring:
  # 生产环境数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: '${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:video_platform}?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8}'
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:50}         # 生产环境大连接池
      minimum-idle: ${DB_MIN_IDLE:10}

  # 生产环境RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:30000}
    publisher-confirms: ${RABBITMQ_PUBLISHER_CONFIRMS:true}        # 生产环境启用确认机制
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}

# 生产环境MQ队列配置
mq:
  enabled: ${MQ_ENABLED:false}  # 公开默认不启用MQ消费者，部署时显式开启
  queues:
    video-task: ${MQ_VIDEO_TASK_QUEUE:video.task.queue}

# 生产环境NFS配置
nfs:
  root-path: ${NFS_ROOT_PATH:/tmp/video-nfs/prod}
  base-url: '${NFS_BASE_URL:https://video.example.com/prod}'
  url-storage-strategy: ABSOLUTE  # 生产环境使用绝对路径，性能更好

# 生产环境日志配置 - 只覆盖需要调整的部分
logging:
  level:
    com.example.video_convert_platform: INFO
    org.springframework: WARN
    org.mybatis: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:./logs/prod/application.log}
    max-size: 100MB
    max-history: 30

# 生产环境性能调优 - 只覆盖需要优化的参数
video:
  processing:
    temp-dir: ${VIDEO_TEMP_DIR:/tmp/video-processing/prod}  # 部署时可覆盖为高性能存储
    chunk-size: 50MB                  # 生产环境增大分片
    max-chunks: 2000                  # 增大分片数限制
    ffmpeg:
      timeout: 300000                 # 基础超时时间(毫秒) - 5分钟
      transcode-timeout-per-minute: 15000  # 转码每分钟视频额外15秒
      slice-timeout-per-minute: 5000       # 切片每分钟视频额外5秒时间
      validate-timeout: 120000             # 验证操作超时
      validate-quick-timeout: 60000        # 快速验证超时
      threads: 4                      # FFmpeg并发线程数
      use-videotoolbox: ${VIDEO_USE_VIDEOTOOLBOX:false}  # 仅在兼容主机上显式启用硬件加速

business:
  callback:
    enabled: ${WEBHOOK_CALLBACK_ENABLED:false} # 部署时显式开启
    retry-times: ${WEBHOOK_CALLBACK_RETRY_TIMES:5} # 生产环境增加重试次数
    timeout: ${WEBHOOK_CALLBACK_TIMEOUT_MS:60000} # 增加超时时间
  archive:
    batch-size: 100                   # 批处理大小
    parallel-workers: 8               # 并发处理线程数
